<path d="M755 680V472" class="path"/><text x="770" y="520" class="id">E07</text>
<text x="320" y="577" font-size="20" style="fill:#a8c7c7" >intervene</text>
<text x="783" y="550" font-size="21" style="fill:#a8c7c7" >choose a reading</text>
<text x="105" y="882" font-size="24" style="fill:#ecc58b" >E09  Physical self-maintenance: a biological model still to earn.</text>
<text x="100" y="971" font-size="25" style="fill:#71d4ca" >E08  BOUNDS + COMPOSITION</text>
<text x="550" y="971" font-size="24" style="fill:#c2d7d8" >Conservation · resources · units · order · calibrated operations</text>
<text x="78" y="1084" font-size="25" style="fill:#b0d0d0" >THREE TESTS BETWEEN A PLAUSIBLE PICTURE AND A USEFUL MODEL</text>
<path d="M80 1114H500" stroke="#71d4ca" stroke-width="3"/>
<text x="80" y="1158" font-size="24" style="fill:#71d4ca" >E13</text>
<text x="80" y="1197" font-size="23" >CAN WE TELL THEM APART?</text>
<text x="80" y="1235" font-size="24" style="fill:#b4ced0" >Distinct states can produce</text>
<text x="80" y="1266" font-size="24" style="fill:#b4ced0" >the same accessible record.</text>
<path d="M570 1114H990" stroke="#71d4ca" stroke-width="3"/>
<text x="570" y="1158" font-size="24" style="fill:#71d4ca" >E14</text>
<text x="570" y="1197" font-size="23" >DOES THE FUTURE DIFFER?</text>
<text x="570" y="1235" font-size="24" style="fill:#b4ced0" >Retain a distinction when it</text>
<text x="570" y="1266" font-size="24" style="fill:#b4ced0" >changes a declared prediction.</text>
<path d="M1060 1114H1480" stroke="#71d4ca" stroke-width="3"/>
<text x="1060" y="1158" font-size="24" style="fill:#71d4ca" >E15</text>
<text x="1060" y="1197" font-size="23" >CAN AN ACTION HELP?</text>
<text x="1060" y="1235" font-size="24" style="fill:#b4ced0" >Perfect information still has</text>
<text x="1060" y="1266" font-size="24" style="fill:#b4ced0" >an attainable decision ceiling.</text>
<text x="80" y="1335" font-size="25" style="fill:#b0d0d0" >A SECOND LOOP: REVISE OUR KNOWLEDGE OF THE FIRST</text>
<rect x="80" y="1364" width="390" height="106" rx="8" fill="#152e36" stroke="#5a7578"/>
<text x="97" y="1405" font-size="27" >Results + counterexamples</text>
<text x="97" y="1442" font-size="22" style="fill:#b4ced0" >Retain successes and failures</text>
<rect x="580" y="1364" width="390" height="106" rx="8" fill="#152e36" stroke="#5a7578"/>
<text x="597" y="1405" font-size="27" >Review the evidence</text>
<text x="597" y="1442" font-size="22" style="fill:#b4ced0" >Check premises and scope</text>
<rect x="1080" y="1364" width="390" height="106" rx="8" fill="#152e36" stroke="#5a7578"/>
<text x="1097" y="1405" font-size="27" >Version the shared map</text>
<text x="1097" y="1442" font-size="22" style="fill:#b4ced0" >Update affected relationships</text>
<path d="M470 1415H580M970 1415H1080" class="path"/>
<text x="497" y="1389" font-size="22" style="fill:#71d4ca" >E11</text>
<text x="996" y="1389" font-size="22" style="fill:#71d4ca" >E12</text>
<path d="M1275 1470V1494H275V1470" class="path"/>
<text x="585" y="1489" font-size="18" style="fill:#71d4ca" >E12 · next discriminating test</text>
<text x="80" y="1535" font-size="24" style="fill:#b4ced0" >Human-reviewed revisions · source-bound connections · no automatic promotion to scientific law</text>
<path d="M80 1558H1480" stroke="#3b5a60"/>
<text x="80" y="1594" font-size="25" style="fill:#ecc58b" >E10  SUBJECTIVE EXPERIENCE REMAINS AN OPEN QUESTION</text>
<text x="80" y="1635" font-size="25" style="fill:#c3cece" >No loop shape, simulation or associative algebra establishes consciousness.</text>
<text x="80" y="1698" font-size="23" style="fill:#71d4ca" >EVERY E-NUMBER → HONESTY: DERIVATION · SOURCE · ASSUMPTIONS · FAILURE</text>
<text x="80" y="1737" font-size="20" style="fill:#9cbdc0" >Version 2026-09-14-r2  /  Conceptual research map; current implementation is a local finite-model prototype.</text>
