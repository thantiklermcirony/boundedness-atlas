<text x="75" y="65" font-size="24" style="fill:#a5c8c9" >DANIEL JOHN MURRAY / THE MURRAY RESEARCH PROGRAMME</text>
<text x="70" y="136" font-size="58" >THE OBSERVER IN THE WORLD</text>
<text x="75" y="182" font-size="27" style="fill:#b9d6d4" >A part of the world, learning what to retain — and when it can act.</text>
<rect x="50" y="226" width="1460" height="800" rx="18" fill="#0b202a" stroke="#32505a"/>
<text x="80" y="267" font-size="22" style="fill:#a5c8c9" >ONE PHYSICAL WORLD · DECLARE THE DOMAIN, DO NOT ASSUME COMPLETENESS</text>
<path d="M540 290H1440V913H85V607H540Z" fill="#72cdb8" fill-opacity=".035" stroke="#557e79" stroke-dasharray="6 7"/>
<text x="565" y="308" font-size="22" style="fill:#b0d9cb" >OBSERVER DESCRIPTION</text>
<rect x="105" y="320" width="340" height="152" rx="10" fill="#102e38" stroke="#4b737a"/>
<text x="123" y="347" font-size="17" style="fill:#8ac6be" >SCOPED MODEL</text>
<text x="123" y="386" font-size="31" >Physical system</text>
<text x="123" y="423" font-size="21" style="fill:#bed0d1" >Declared states and mechanisms</text>
<text x="123" y="452" font-size="21" style="fill:#bed0d1" >Preparation · domain · clock</text>
<rect x="590" y="320" width="330" height="152" rx="10" fill="#102e38" stroke="#4b737a"/>
<text x="608" y="347" font-size="17" style="fill:#8ac6be" >OBSERVATION MODEL</text>
<text x="608" y="386" font-size="31" >Accessible signals</text>
<text x="608" y="423" font-size="21" style="fill:#bed0d1" >A measurement is a channel</text>
<text x="608" y="452" font-size="21" style="fill:#bed0d1" >Calibration · noise · selectivity</text>
<rect x="1060" y="320" width="330" height="152" rx="10" fill="#102e38" stroke="#4b737a"/>
<text x="1078" y="347" font-size="17" style="fill:#8ac6be" >ENCODED HISTORY</text>
<text x="1078" y="386" font-size="31" >Retained record</text>
<text x="1078" y="423" font-size="21" style="fill:#bed0d1" >What was actually observed</text>
<text x="1078" y="452" font-size="21" style="fill:#bed0d1" >Order · time · provenance</text>
<rect x="1060" y="680" width="330" height="152" rx="10" fill="#102e38" stroke="#4b737a"/>
<text x="1078" y="707" font-size="17" style="fill:#8ac6be" >CONDITIONAL INFERENCE</text>
<text x="1078" y="746" font-size="31" >Estimated state</text>
<text x="1078" y="783" font-size="21" style="fill:#bed0d1" >Uncertainty over possible states</text>
<text x="1078" y="812" font-size="21" style="fill:#bed0d1" >An estimate is not the world</text>
<rect x="590" y="680" width="330" height="152" rx="10" fill="#102e38" stroke="#4b737a"/>
<text x="608" y="707" font-size="17" style="fill:#8ac6be" >MODEL-RELATIVE VALUE</text>
<text x="608" y="746" font-size="31" >Future + decision</text>
<text x="608" y="783" font-size="21" style="fill:#bed0d1" >Predict a declared outcome</text>
<text x="608" y="812" font-size="21" style="fill:#bed0d1" >Choose within the action budget</text>
<rect x="125" y="680" width="330" height="152" rx="10" fill="#102e38" stroke="#4b737a"/>
<text x="143" y="707" font-size="17" style="fill:#8ac6be" >AVAILABLE CONTROL</text>
<text x="143" y="746" font-size="31" >Physical action</text>
<text x="143" y="783" font-size="21" style="fill:#bed0d1" >Changes later conditions</text>
<text x="143" y="812" font-size="21" style="fill:#bed0d1" >Effects need a tested mechanism</text>
